name: Reusable Binary Release

on:
  workflow_call:
    inputs:
      release_channel:
        description: "stable publishes a versioned release; latest replaces the rolling main release."
        required: false
        type: string
        default: stable
      binaries:
        description: >-
          JSON array of binary specs. Each item supports name, optional asset_prefix,
          build_command, and output_path. The workflow exposes TAG, VERSION,
          RELEASE_TARGET, BUN_TARGET, BINARY_NAME, ASSET_PREFIX, ASSET_EXTENSION, and ASSET_PATH
          to build_command.
        required: true
        type: string
      install_command:
        description: Dependency installation command.
        required: false
        type: string
        default: bun install --frozen-lockfile
      prebuild_command:
        description: Optional command to run once per runner before its targets' binary builds.
        required: false
        type: string
        default: ""
      bun_version:
        description: Bun version passed to oven-sh/setup-bun.
        required: false
        type: string
        default: latest
      update_package_version:
        description: Whether to update the root package.json version from the release tag before building.
        required: false
        type: boolean
        default: true
      generate_checksums:
        description: Whether to generate SHA-256 checksum files beside each release asset.
        required: false
        type: boolean
        default: true
      targets:
        description: JSON targets grouped by os runner. Defaults to Linux/Windows on Ubuntu and Darwin on macOS, each x64/arm64.
        required: false
        type: string
        default: >-
          [
            {"os":"ubuntu-latest","target":"linux-x64","bun_target":"bun-linux-x64"},
            {"os":"ubuntu-latest","target":"linux-arm64","bun_target":"bun-linux-arm64"},
            {"os":"macos-latest","target":"darwin-x64","bun_target":"bun-darwin-x64"},
            {"os":"macos-latest","target":"darwin-arm64","bun_target":"bun-darwin-arm64"},
            {"os":"ubuntu-latest","target":"windows-x64","bun_target":"bun-windows-x64"},
            {"os":"ubuntu-latest","target":"windows-arm64","bun_target":"bun-windows-arm64"}
          ]
    secrets:
      macos_signing_certificate_base64:
        description: Optional Base64-encoded PKCS#12 certificate for macOS binaries.
        required: false
      macos_signing_certificate_password:
        description: Password for the macOS PKCS#12 signing certificate.
        required: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.channel.outputs.release_tag }}
      build_groups: ${{ steps.build_groups.outputs.groups }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate release channel
        id: channel
        env:
          CHANNEL: ${{ inputs.release_channel }}
        run: |
          case "$CHANNEL" in
            stable) echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            latest) echo "release_tag=latest" >> "$GITHUB_OUTPUT" ;;
            *) echo "release_channel must be stable or latest." >&2; exit 1 ;;
          esac
      - name: Group targets by runner
        id: build_groups
        env:
          TARGETS_JSON: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          GROUPS_JSON="$(printf '%s' "$TARGETS_JSON" | jq -c '
            group_by(.os) | map({
              os: .[0].os,
              targets: .,
              sign_macos: any(.[]; .target | startswith("darwin-"))
            })
          ')"
          echo "groups=$GROUPS_JSON" >> "$GITHUB_OUTPUT"
      - name: Resolve build version
        id: version
        uses: pablozaiden/installer/.github/actions/resolve-version@b47bdc7e7721c12c9b6b8e5e0a97c045bf526a9b
        with:
          mode: ${{ inputs.release_channel == 'latest' && 'main' || 'release' }}
          github_token: ${{ github.token }}

  build-binaries:
    needs: metadata
    name: Build on ${{ matrix.group.os }}
    runs-on: ${{ matrix.group.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.metadata.outputs.build_groups) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Install dependencies
        run: ${{ inputs.install_command }}

      - name: Update package.json version
        if: ${{ inputs.update_package_version }}
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          bun -e 'const path = "package.json";
          const value = await Bun.file(path).json();
          value.version = process.env.VERSION.replace(/^v/, "");
          await Bun.write(path, JSON.stringify(value, null, 2) + "\n");'

      - name: Run prebuild command
        if: ${{ inputs.prebuild_command != '' }}
        run: ${{ inputs.prebuild_command }}

      - name: Prepare macOS signing keychain
        if: matrix.group.sign_macos
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.macos_signing_certificate_base64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.macos_signing_certificate_password }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_SIGNING_CERTIFICATE_BASE64:-}" ] && [ -z "${MACOS_SIGNING_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::notice::No macOS signing certificate was supplied; macOS artifacts will remain unsigned."
            exit 0
          fi
          if [ -z "${MACOS_SIGNING_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_SIGNING_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Both macOS signing secrets must be supplied together." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/macos-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          {
            printf 'MACOS_SIGNING_CERTIFICATE_PATH=%s\n' "$CERTIFICATE_PATH"
            printf 'MACOS_SIGNING_KEYCHAIN=%s\n' "$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-certificate -a -Z "$KEYCHAIN_PATH" \
            | sed -n 's/^SHA-1 hash: \([0-9A-Fa-f]\{40\}\)$/\1/p' \
            | head -n 1)"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No imported macOS signing certificate fingerprint was found." >&2
            security find-certificate -a -Z "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi

          {
            printf 'MACOS_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Build and stage release assets
        env:
          BINARIES_JSON: ${{ inputs.binaries }}
          TARGETS_JSON: ${{ toJson(matrix.group.targets) }}
          TAG: v${{ needs.metadata.outputs.version }}
          VERSION: ${{ needs.metadata.outputs.version }}
          GENERATE_CHECKSUMS: ${{ inputs.generate_checksums }}
        run: |
          set -euo pipefail
          export TAG VERSION
          mkdir -p "$RUNNER_TEMP/release-assets"
          BINARIES_PATH="$RUNNER_TEMP/binaries.json"
          TARGETS_PATH="$RUNNER_TEMP/targets.json"
          printf '%s' "$BINARIES_JSON" > "$BINARIES_PATH"
          printf '%s' "$TARGETS_JSON" > "$TARGETS_PATH"

          jq -c '.[]' "$TARGETS_PATH" | while read -r target; do
            RELEASE_TARGET="$(printf '%s' "$target" | jq -r '.target')"
            BUN_TARGET="$(printf '%s' "$target" | jq -r '.bun_target')"
            export RELEASE_TARGET BUN_TARGET
            echo "::group::Build $RELEASE_TARGET"

            jq -c '.[]' "$BINARIES_PATH" | while read -r spec; do
              BINARY_NAME="$(printf '%s' "$spec" | jq -r '.name')"
              ASSET_PREFIX="$(printf '%s' "$spec" | jq -r '.asset_prefix // .assetPrefix // .name')"
              BUILD_COMMAND="$(printf '%s' "$spec" | jq -r '.build_command // .buildCommand')"
              OUTPUT_PATH="$(printf '%s' "$spec" | jq -r '.output_path // .outputPath')"
              ASSET_EXTENSION=""
              if [[ "$RELEASE_TARGET" == windows-* ]]; then
                ASSET_EXTENSION=".exe"
              fi
              ASSET_NAME="${ASSET_PREFIX}-${TAG}-${RELEASE_TARGET}${ASSET_EXTENSION}"
              ASSET_PATH="$RUNNER_TEMP/release-assets/${ASSET_NAME}"
              export BINARY_NAME ASSET_PREFIX ASSET_EXTENSION ASSET_NAME ASSET_PATH OUTPUT_PATH

              if [ -z "$BUILD_COMMAND" ] || [ "$BUILD_COMMAND" = "null" ]; then
                echo "Missing build_command for ${BINARY_NAME}" >&2
                exit 1
              fi
              if [ -z "$OUTPUT_PATH" ] || [ "$OUTPUT_PATH" = "null" ]; then
                echo "Missing output_path for ${BINARY_NAME}" >&2
                exit 1
              fi

              eval "$BUILD_COMMAND"
              RESOLVED_OUTPUT_PATH="$(eval "printf '%s' \"$OUTPUT_PATH\"")"
              if [ ! -f "$RESOLVED_OUTPUT_PATH" ]; then
                echo "Missing build output for ${BINARY_NAME} (${RELEASE_TARGET}): ${RESOLVED_OUTPUT_PATH}" >&2
                exit 1
              fi
              if [[ "$RELEASE_TARGET" == darwin-* && -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
                codesign \
                  --force \
                  --sign "$MACOS_SIGNING_IDENTITY" \
                  --keychain "$MACOS_SIGNING_KEYCHAIN" \
                  --timestamp=none \
                  "$RESOLVED_OUTPUT_PATH"
              fi
              if [ "$RESOLVED_OUTPUT_PATH" != "$ASSET_PATH" ]; then
                cp "$RESOLVED_OUTPUT_PATH" "$ASSET_PATH"
              fi
              if [[ "$RELEASE_TARGET" != windows-* ]]; then
                chmod +x "$ASSET_PATH"
              fi
              if [ "$GENERATE_CHECKSUMS" = "true" ]; then
                bun -e '
                  import { createHash } from "node:crypto";
                  const path = process.env.ASSET_PATH;
                  const name = process.env.ASSET_NAME;
                  const payload = await Bun.file(path).arrayBuffer();
                  const hash = createHash("sha256").update(new Uint8Array(payload)).digest("hex");
                  await Bun.write(`${path}.sha256`, `${hash}  ${name}\n`);
                '
              fi
            done
            echo "::endgroup::"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.group.os }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove macOS signing keychain
        if: ${{ always() && matrix.group.sign_macos }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${MACOS_SIGNING_CERTIFICATE_PATH:-}" ]; then
            rm -f "$MACOS_SIGNING_CERTIFICATE_PATH"
          fi

  publish-release-assets:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [metadata, build-binaries]
    concurrency:
      group: binary-release-${{ github.repository }}-${{ inputs.release_channel }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download release asset artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-assets-*
          path: dist/release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.release_channel }}
          TAG: ${{ needs.metadata.outputs.release_tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "latest" ]; then
            DEFAULT_BRANCH="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
            HEAD_SHA="$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq '.sha')"
            if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
              echo "::notice::Skipping superseded main build $GITHUB_SHA."
              exit 0
            fi
            RELEASE_ID="$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == "latest") | .id')"
            if [ -z "$RELEASE_ID" ]; then
              gh release create latest --target "$GITHUB_SHA" --title latest \
                --notes "Rolling main build $VERSION ($GITHUB_SHA)." --prerelease --latest=false
            fi
          fi

          gh release upload "$TAG" dist/release-assets/* --clobber --repo "$GH_REPO"

          if [ "$CHANNEL" = "latest" ]; then
            jq -n --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
              '{schemaVersion: 1, channel: "latest", version: $version, revision: $revision}' \
              > dist/release-assets/release.json
            # Switch readers only after every uniquely named binary and checksum exists.
            gh release upload latest dist/release-assets/release.json --clobber --repo "$GH_REPO"
            gh api "repos/$GH_REPO/git/refs/tags/latest" --method PATCH \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit latest --title latest --prerelease --latest=false \
              --notes "Rolling main build $VERSION ($GITHUB_SHA)."
            gh api "repos/$GH_REPO/releases/tags/latest" \
              --jq ".assets[] | select(.name != \"release.json\" and (.name | contains(\"-v$VERSION-\")) == false) | .id" \
              | while read -r asset_id; do
                gh api "repos/$GH_REPO/releases/assets/$asset_id" --method DELETE
              done
          fi
