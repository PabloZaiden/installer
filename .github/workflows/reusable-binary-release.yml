name: Reusable Binary Release

on:
  workflow_call:
    inputs:
      binaries:
        description: >-
          JSON array of binary specs. Each item supports name, optional asset_prefix,
          build_command, and output_path. The workflow exposes TAG, VERSION,
          RELEASE_TARGET, BUN_TARGET, BINARY_NAME, ASSET_PREFIX, and ASSET_PATH
          to build_command.
        required: true
        type: string
      install_command:
        description: Dependency installation command.
        required: false
        type: string
        default: bun install --frozen-lockfile
      prebuild_command:
        description: Optional command to run before each target's binary builds.
        required: false
        type: string
        default: ""
      bun_version:
        description: Bun version passed to oven-sh/setup-bun.
        required: false
        type: string
        default: latest
      update_package_version:
        description: Whether to update the root package.json version from the release tag before building.
        required: false
        type: boolean
        default: true
      generate_checksums:
        description: Whether to generate SHA-256 checksum files beside each release asset.
        required: false
        type: boolean
        default: true
      targets:
        description: JSON target matrix. Defaults to Linux/macOS x64/arm64.
        required: false
        type: string
        default: >-
          [
            {"os":"ubuntu-latest","target":"linux-x64","bun_target":"bun-linux-x64"},
            {"os":"ubuntu-latest","target":"linux-arm64","bun_target":"bun-linux-arm64"},
            {"os":"macos-latest","target":"darwin-x64","bun_target":"bun-darwin-x64"},
            {"os":"macos-latest","target":"darwin-arm64","bun_target":"bun-darwin-arm64"}
          ]
    secrets:
      macos_signing_certificate_base64:
        description: Optional Base64-encoded PKCS#12 certificate for macOS binaries.
        required: false
      macos_signing_certificate_password:
        description: Password for the macOS PKCS#12 signing certificate.
        required: false

jobs:
  build-binaries:
    name: Build ${{ matrix.target.target }}
    runs-on: ${{ matrix.target.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Install dependencies
        run: ${{ inputs.install_command }}

      - name: Update package.json version
        if: ${{ inputs.update_package_version }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Run prebuild command
        if: ${{ inputs.prebuild_command != '' }}
        run: ${{ inputs.prebuild_command }}

      - name: Prepare macOS signing keychain
        if: startsWith(matrix.target.target, 'darwin-')
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.macos_signing_certificate_base64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.macos_signing_certificate_password }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_SIGNING_CERTIFICATE_BASE64:-}" ] && [ -z "${MACOS_SIGNING_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::notice::No macOS signing certificate was supplied; macOS artifacts will remain unsigned."
            exit 0
          fi
          if [ -z "${MACOS_SIGNING_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_SIGNING_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Both macOS signing secrets must be supplied together." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/macos-signing.p12"
          CERTIFICATE_PEM_PATH="$RUNNER_TEMP/macos-signing.pem"
          PRIVATE_KEY_PEM_PATH="$RUNNER_TEMP/macos-signing-key.pem"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          {
            printf 'MACOS_SIGNING_CERTIFICATE_PATH=%s\n' "$CERTIFICATE_PATH"
            printf 'MACOS_SIGNING_CERTIFICATE_PEM_PATH=%s\n' "$CERTIFICATE_PEM_PATH"
            printf 'MACOS_SIGNING_PRIVATE_KEY_PEM_PATH=%s\n' "$PRIVATE_KEY_PEM_PATH"
            printf 'MACOS_SIGNING_KEYCHAIN=%s\n' "$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -clcerts \
            -nokeys \
            -passin env:MACOS_SIGNING_CERTIFICATE_PASSWORD \
            -out "$CERTIFICATE_PEM_PATH"
          openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -nocerts \
            -nodes \
            -passin env:MACOS_SIGNING_CERTIFICATE_PASSWORD \
            -out "$PRIVATE_KEY_PEM_PATH"
          # macOS Security may reject modern AES-encrypted PKCS#12 containers.
          security import "$PRIVATE_KEY_PEM_PATH" \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign
          security import "$CERTIFICATE_PEM_PATH" \
            -k "$KEYCHAIN_PATH"
          security add-trusted-cert \
            -k "$KEYCHAIN_PATH" \
            -r trustRoot \
            -p codeSign \
            "$CERTIFICATE_PEM_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(.*\)"/\1/p' \
            | head -n 1)"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No codesigning identity was found in the imported macOS certificate." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi

          {
            printf 'MACOS_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Build and stage release assets
        env:
          BINARIES_JSON: ${{ inputs.binaries }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target.target }}
          BUN_TARGET: ${{ matrix.target.bun_target }}
          GENERATE_CHECKSUMS: ${{ inputs.generate_checksums }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          export TAG VERSION RELEASE_TARGET BUN_TARGET
          mkdir -p dist/release-assets
          printf '%s' "$BINARIES_JSON" > /tmp/binaries.json

          jq -c '.[]' /tmp/binaries.json | while read -r spec; do
            BINARY_NAME="$(printf '%s' "$spec" | jq -r '.name')"
            ASSET_PREFIX="$(printf '%s' "$spec" | jq -r '.asset_prefix // .assetPrefix // .name')"
            BUILD_COMMAND="$(printf '%s' "$spec" | jq -r '.build_command // .buildCommand')"
            OUTPUT_PATH="$(printf '%s' "$spec" | jq -r '.output_path // .outputPath')"
            ASSET_NAME="${ASSET_PREFIX}-${TAG}-${RELEASE_TARGET}"
            ASSET_PATH="dist/release-assets/${ASSET_NAME}"
            export BINARY_NAME ASSET_PREFIX ASSET_NAME ASSET_PATH OUTPUT_PATH

            if [ -z "$BUILD_COMMAND" ] || [ "$BUILD_COMMAND" = "null" ]; then
              echo "Missing build_command for ${BINARY_NAME}" >&2
              exit 1
            fi
            if [ -z "$OUTPUT_PATH" ] || [ "$OUTPUT_PATH" = "null" ]; then
              echo "Missing output_path for ${BINARY_NAME}" >&2
              exit 1
            fi

            eval "$BUILD_COMMAND"
            RESOLVED_OUTPUT_PATH="$(eval "printf '%s' \"$OUTPUT_PATH\"")"
            test -f "$RESOLVED_OUTPUT_PATH"
            if [[ "$RELEASE_TARGET" == darwin-* && -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
              codesign \
                --force \
                --sign "$MACOS_SIGNING_IDENTITY" \
                --keychain "$MACOS_SIGNING_KEYCHAIN" \
                --timestamp=none \
                "$RESOLVED_OUTPUT_PATH"
            fi
            cp "$RESOLVED_OUTPUT_PATH" "$ASSET_PATH"
            chmod +x "$ASSET_PATH"
            if [ "$GENERATE_CHECKSUMS" = "true" ]; then
              (cd dist/release-assets && shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256")
            fi
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.target.target }}
          path: dist/release-assets/*
          if-no-files-found: error

      - name: Remove macOS signing keychain
        if: ${{ always() && startsWith(matrix.target.target, 'darwin-') }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${MACOS_SIGNING_CERTIFICATE_PATH:-}" ]; then
            rm -f "$MACOS_SIGNING_CERTIFICATE_PATH"
          fi
          if [ -n "${MACOS_SIGNING_CERTIFICATE_PEM_PATH:-}" ]; then
            rm -f "$MACOS_SIGNING_CERTIFICATE_PEM_PATH"
          fi
          if [ -n "${MACOS_SIGNING_PRIVATE_KEY_PEM_PATH:-}" ]; then
            rm -f "$MACOS_SIGNING_PRIVATE_KEY_PEM_PATH"
          fi

  publish-release-assets:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write

    steps:
      - name: Download release asset artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-assets-*
          path: dist/release-assets
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" dist/release-assets/* --clobber --repo "$GH_REPO"
